services:
  app:
    image: node:22-bookworm-slim
    env_file:
      - .env
    volumes:
      - ./:/app:delegated
      - /app/node_modules
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - NITRO_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    command: sh -c "corepack enable && pnpm install --silent && pnpm dev"
    depends_on: []

  pages-preview:
    build:
      context: .
      dockerfile: Dockerfile
      # platform: linux/arm64  # uncomment on Apple Silicon or CI if needed
    image: meowgic-snap-pages:latest
    # Image-only preview (production-style): no host mount
    working_dir: /app
    ports:
      - "8788:8788"
    command: sh -c "npx -y wrangler@4 pages dev dist --ip 0.0.0.0 --port 8788"
    environment:
      - NODE_ENV=production
    depends_on:
      - app

  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data:
