services:
  app:
    image: node:22-bookworm-slim
    env_file:
      - .env
    volumes:
      - ./:/app:delegated
      - /app/node_modules
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - NITRO_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    command: sh -c "corepack enable && pnpm install --silent && pnpm dev"
    depends_on: []

  # Production preview (Cloudflare Pages / workerd) of the dist that the app container builds:
  #   docker compose exec app pnpm build:pages          (app must be running)
  #   docker compose --profile preview up -d --force-recreate pages-preview   → http://localhost:8788
  # Not started by a plain `docker compose up`; stop with `docker compose --profile preview down`
  # (a plain `down` leaves this container behind, pointing at a removed network). ca-certificates: workerd needs them for HTTPS to Supabase.
  pages-preview:
    image: node:22-bookworm-slim
    profiles: [preview]
    # The whole project, not ./dist: each build deletes and recreates dist, and a mount of the old
    # folder would keep serving the deleted (empty) one. wrangler keeps its state in /tmp.
    volumes:
      - ./:/project:ro
    working_dir: /tmp
    ports:
      - "127.0.0.1:8788:8788"
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates > /dev/null
      && npx -y wrangler@4 pages dev /project/dist --ip 0.0.0.0 --port 8788"
